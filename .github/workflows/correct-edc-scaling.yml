name: Correct EDC Critical Scaling

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-edc-critical-scaling
  cancel-in-progress: false

jobs:
  correct-scaling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify source state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "README.md": "794fd00844aa55f2b93e03d17ec451ca02f2a59b27d6438ef7001ceaecc6684c",
              "formulas.md": "2089b6a2c7a0ef58983db11dfc275e1f654a2f7b26f1429f54f9d632fd23a883",
          }

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              digest.update(path.read_bytes())
              return digest.hexdigest()

          for relative, wanted in expected.items():
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f"Missing source file: {relative}")
              actual = sha256(path)
              if actual != wanted:
                  raise SystemExit(
                      f"Source hash mismatch for {relative}\n"
                      f"expected: {wanted}\n"
                      f"actual:   {actual}"
                  )

          readme = Path("README.md").read_text(encoding="utf-8")
          formulas = Path("formulas.md").read_text(encoding="utf-8")

          required_readme = [
              "dC/dt = v_eff t C − C³",
              "t_delay ~ v_eff^(−1/3)",
              "## Why the Scaling Is Cubic",
              "Thus, the exponent −1/3 follows from the cubic nonlinear saturation term and is not an external assumption.",
          ]

          for marker in required_readme:
              if marker not in readme:
                  raise SystemExit(
                      f"README preflight marker missing: {marker}"
                  )

          if readme.count("t_delay ~ v_eff^(−1/3)") != 2:
              raise SystemExit(
                  "README must contain exactly two obsolete delay formulas"
              )

          if "## EDC Critical Ramp Scaling" in formulas:
              raise SystemExit(
                  "formulas.md already contains the correction block"
              )

          if formulas.count(
              "# 11. Local Quasi-Linear Stability Approximation"
          ) != 1:
              raise SystemExit(
                  "formulas.md insertion marker is not unique"
              )

          print("Source state verified.")
          PY

      - name: Apply scaling correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          formulas_path = Path("formulas.md")

          readme = readme_path.read_text(encoding="utf-8")
          formulas = formulas_path.read_text(encoding="utf-8")

          start = "The characteristic critical delay follows:\n"
          end = "\n## Scope\n"

          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit(
                  "README replacement boundaries are not unique"
              )

          replacement = """The reduced critical equation has the canonical ramp scaling:
          
          C = v_eff^(1/4) y
          
          t = v_eff^(−1/2) τ
          
          which transforms:
          
          dC/dt = v_eff t C − C³
          
          into the parameter-free form:
          
          dy/dτ = τ y − y³
          
          Therefore, the characteristic amplitude and critical time scales are:
          
          C_critical ~ v_eff^(1/4)
          
          t_critical ~ v_eff^(−1/2)
          
          and the characteristic critical-delay scale is:
          
          t_delay ~ v_eff^(−1/2)
          
          This means that the available critical-response time compresses as endogenous drift accelerates. The scaling is a deterministic critical ramp scale of the reduced normal form; an observed transition delay may also depend on the initial coherence amplitude, perturbations, noise, and the operational threshold used to identify transition.
          
          ## Cubic Saturation and Three-Dimensional Interpretation
          
          The term:
          
          −C³
          
          is the nonlinear saturation term in the adopted scalar critical normal form.
          
          Within the EDS interpretation, C may be read as a characteristic linear coherence amplitude of an endogenous structure embedded in three-dimensional space. Under that interpretation, the associated coherent volume scales as:
          
          V_coh ∝ C³
          
          so the cubic saturation term has a volumetric interpretation: increasing coherence is constrained by three-dimensional retained organization, internal compatibility, and nonlinear self-interaction.
          
          The three-dimensional interpretation supports the physical meaning assigned to the cubic term, but spatial dimensionality alone does not derive the normal-form exponent. The cubic term is also the lowest-order nonlinear saturation retained in the adopted scalar amplitude model. Consequently, the volumetric interpretation and the normal-form truncation must be stated together.
          
          Operationally:
          
          - linear endogenous drift moves the system toward the critical boundary;
          - cubic saturation limits the growth of endogenous structural coherence;
          - the adopted three-dimensional interpretation assigns V_coh ∝ C³ to the coherent structure;
          - the resulting critical ramp scale is t_delay ~ v_eff^(−1/2);
          - faster endogenous drift compresses the characteristic critical-response time.
          """

          left = readme.index(start)
          right = readme.index(end, left)

          readme = (
              readme[:left]
              + replacement.rstrip()
              + "\n"
              + readme[right:]
          )

          insertion_marker = (
              "# 11. Local Quasi-Linear Stability Approximation"
          )

          scaling_block = """## EDC Critical Ramp Scaling
          
          Near the EDS–EDC boundary, the reduced scalar critical dynamics may be written as:
          
          `dC/dt = v_eff t C − C³`
          
          Introduce the canonical variables:
          
          `C = v_eff^(1/4) y`
          
          `t = v_eff^(−1/2) τ`
          
          The reduced equation becomes:
          
          `dy/dτ = τ y − y³`
          
          Therefore:
          
          `C_critical ~ v_eff^(1/4)`
          
          `t_critical ~ v_eff^(−1/2)`
          
          `t_delay ~ v_eff^(−1/2)`
          
          The delay relation is the characteristic deterministic critical ramp scale of this reduced normal form. A measured or simulated transition delay may additionally depend on initial conditions, perturbation amplitude, noise, and the operational transition threshold.
          
          For the adopted three-dimensional EDS interpretation, when `C` is treated as a characteristic linear coherence amplitude, the corresponding coherent volume obeys:
          
          `V_coh ∝ C³`
          
          This gives the cubic saturation term a volumetric interpretation. Spatial dimensionality alone does not determine the normal-form exponent; the interpretation must remain consistent with the definition of `C` and with the adopted scalar amplitude truncation.
          
          """

          formulas = formulas.replace(
              insertion_marker,
              scaling_block + insertion_marker,
              1,
          )

          readme_path.write_text(
              readme.rstrip() + "\n",
              encoding="utf-8",
              newline="\n",
          )

          formulas_path.write_text(
              formulas.rstrip() + "\n",
              encoding="utf-8",
              newline="\n",
          )

          print("Scaling correction applied.")
          PY

      - name: Verify corrected mathematics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          documentation = []

          for path in Path(".").rglob("*"):
              if (
                  not path.is_file()
                  or ".git" in path.parts
                  or ".github" in path.parts
              ):
                  continue

              if path.suffix.lower() in {
                  ".md",
                  ".cff",
                  ".txt",
              }:
                  documentation.append(path)

          forbidden = [
              "v_eff^(−1/3)",
              "v_eff^(-1/3)",
              "the exponent −1/3",
              "The exponent:\n\n−1/3",
              "A quadratic correction would describe pairwise or surface-like limitation.",
              "retained three-dimensional structural organization requires third-order nonlinear stabilization",
          ]

          for path in documentation:
              text = path.read_text(encoding="utf-8")

              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(
                          f"Obsolete scaling statement remains in "
                          f"{path}: {marker}"
                      )

          readme = Path("README.md").read_text(
              encoding="utf-8"
          )

          formulas = Path("formulas.md").read_text(
              encoding="utf-8"
          )

          required_readme = [
              "C = v_eff^(1/4) y",
              "t = v_eff^(−1/2) τ",
              "dy/dτ = τ y − y³",
              "C_critical ~ v_eff^(1/4)",
              "t_delay ~ v_eff^(−1/2)",
              "V_coh ∝ C³",
              "spatial dimensionality alone does not derive the normal-form exponent",
          ]

          required_formulas = [
              "## EDC Critical Ramp Scaling",
              "`C = v_eff^(1/4) y`",
              "`t = v_eff^(−1/2) τ`",
              "`dy/dτ = τ y − y³`",
              "`t_delay ~ v_eff^(−1/2)`",
              "`V_coh ∝ C³`",
          ]

          for marker in required_readme:
              if marker not in readme:
                  raise SystemExit(
                      f"Corrected README marker missing: {marker}"
                  )

          for marker in required_formulas:
              if marker not in formulas:
                  raise SystemExit(
                      f"Corrected formulas marker missing: {marker}"
                  )

          if readme.count(
              "t_delay ~ v_eff^(−1/2)"
          ) != 2:
              raise SystemExit(
                  "README must contain exactly two corrected delay formulas"
              )

          if formulas.count(
              "## EDC Critical Ramp Scaling"
          ) != 1:
              raise SystemExit(
                  "formulas.md must contain exactly one critical scaling block"
              )

          print("Corrected mathematics verified.")
          PY

      - name: Remove completed one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/correct-edc-scaling.yml

      - name: Verify changed file boundary
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            '.github/workflows/correct-edc-scaling.yml' \
            'README.md' \
            'formulas.md' \
            | sort > /tmp/expected-files.txt

          git status --porcelain=v1 \
            | cut -c4- \
            | sort > /tmp/actual-files.txt

          diff -u \
            /tmp/expected-files.txt \
            /tmp/actual-files.txt

          echo "Changed-file boundary verified."

      - name: Verify repository diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          git status --short
          git diff --stat

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No correction changes were staged."
            exit 1
          fi

          git commit \
            -m "Correct EDC critical scaling"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
